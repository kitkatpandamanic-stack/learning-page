name: Uptime

# Checks the live site every 15 minutes. If something is down it opens an
# issue labelled "uptime" (GitHub then notifies the repository's owner), and
# closes it again once everything is back.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://pandadev-chi.vercel.app
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check pages, the API and the offline files
        id: check
        run: |
          failures=""
          check() { # url, text the page must contain (optional)
            for attempt in 1 2; do
              body=$(curl -sS -L -m 20 -w '\n%{http_code}' "$SITE$1") || body=$'\n000'
              code=$(tail -n1 <<<"$body")
              if [ "$code" = "200" ] && { [ -z "$2" ] || grep -qF "$2" <<<"$body"; }; then
                echo "ok   $1"; return
              fi
              sleep 10
            done
            echo "FAIL $1 (HTTP $code)"
            failures="$failures\n- \`$1\` answered HTTP $code"
          }
          check / "PandaDev"
          check /learn/javascript/hello-world "Hello"
          check /ru/learn/python/hello-world "Python"
          check "/api/progress?language=javascript" "signedIn"
          check /api/auth/get-session
          check /sitemap.xml "<urlset"
          check /sw.js "PandaDev"
          check /manifest.webmanifest "PandaDev"
          if [ -n "$failures" ]; then
            echo "down=true" >> "$GITHUB_OUTPUT"
            { echo "failures<<EOF"; echo -e "$failures"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "down=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the issue
        if: steps.check.outputs.down == 'true'
        run: |
          gh label create uptime --color B60205 --description "The live site is down" 2>/dev/null || true
          body=$(printf 'The uptime check found problems at %s:\n%b\n\n[Run log](%s/%s/actions/runs/%s)' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "${{ steps.check.outputs.failures }}" \
            "${{ github.server_url }}" "$GH_REPO" "${{ github.run_id }}")
          open=$(gh issue list --label uptime --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "The site is down" --label uptime --body "$body"
          fi
          exit 1

      - name: Close the issue when the site is back
        if: steps.check.outputs.down == 'false'
        run: |
          open=$(gh issue list --label uptime --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "Everything is back up ($(date -u '+%Y-%m-%d %H:%M UTC'))."
          fi
