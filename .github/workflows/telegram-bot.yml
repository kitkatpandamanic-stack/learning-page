name: Telegram bot

# Scheduled jobs for @panda_learning_bot, which run on the live site
# (src/app/api/telegram/cron):
#   - every hour: evening reminders for learners whose clock says 8 pm,
#     whose streak is at risk and who turned reminders on;
#   - Mondays at 11:30 Tashkent (06:30 UTC): last week's leaderboard in the
#     channel, for learners who opted in.
# Needs the CRON_SECRET secret (the same value as on Vercel).
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job"
        type: choice
        options: [reminders, leaderboard]
        default: reminders

permissions: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the job on the site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ inputs.job || (github.event.schedule == '30 6 * * 1' && 'leaderboard' || 'reminders') }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pandadev-chi.vercel.app/api/telegram/cron?job=$JOB"
