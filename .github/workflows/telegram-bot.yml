name: Telegram bot

# Evening reminders from @panda_learning_bot, run on the live site
# (src/app/api/telegram/cron): learners who turned reminders on, whose
# streak is at risk and whose clock says 8–11 pm get one message a day.
# Needs the CRON_SECRET secret (the same value as on Vercel).
#
# GitHub's scheduler is best effort and drops runs at busy times, so this
# runs twice an hour, off the hour; the site sends each learner at most one
# reminder a day however often it runs.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pandadev-chi.vercel.app/api/telegram/cron?job=reminders"
