name: Telegram bot

# The bot's hourly tick on the live site (src/app/api/telegram/cron?job=tick):
# reminders at the hour each learner picked (if their streak is at risk),
# the channel's daily post from 11:00 Tashkent and the Monday leaderboard.
# Needs the CRON_SECRET secret (the same value as on Vercel).
#
# This is the bot's only schedule (an external scheduler was tried and
# dropped). GitHub's scheduler is best effort and drops runs at busy times,
# so this runs twice an hour, off the hour. The site sends each reminder and
# each post once however often it's called.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pandadev-chi.vercel.app/api/telegram/cron?job=tick"
