name: Telegram

# One daily post in the PandaDev Telegram channel (@Kitkatpandamanic) at
# 11:00 Tashkent time (06:00 UTC): the problem of the day, then the quiz
# question as polls. The picks come from the live site's /api/daily, so they
# match it. Needs the TELEGRAM_BOT_TOKEN secret.
# GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "What to post"
        type: choice
        options: [daily, morning, quiz]
        default: daily

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SITE: https://pandadev-chi.vercel.app
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/telegram
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Post
        run: node scripts/telegram/post.mjs "${{ inputs.post || 'daily' }}"
