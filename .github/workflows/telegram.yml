name: Telegram

# One daily post in the PandaDev Telegram channel (@Kitkatpandamanic) around
# 11:00 Tashkent time: a picture of the problems of the day with hint
# buttons, then the quiz question as polls. The live site builds and sends
# it (/api/telegram/cron?job=daily-post), so it matches the site.
# Needs the CRON_SECRET secret (the same value as on Vercel).
#
# The main trigger is cron-job.org's hourly tick (job=tick), which is on
# time; these runs are the backup. GitHub's scheduler is best effort, so
# there are several tries, and the site posts once a day however many
# schedulers ask (preview a post with scripts/telegram/post.mjs --preview).
on:
  schedule:
    - cron: "3 6 * * *"
    - cron: "21 6 * * *"
    - cron: "43 6 * * *"
    - cron: "13 7 * * *"
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      posted: ${{ steps.runs.outputs.posted }}
    steps:
      - name: Already posted today?
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          posted=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow telegram.yml \
            --status success --created ">=$(date -u +%F)" --json databaseId -q length)
          echo "posted=$posted" >> "$GITHUB_OUTPUT"
          [ "$posted" = "0" ] || echo "Today's post already went out; nothing to do."

  post:
    needs: check
    # Scheduled tries stop once one has run; the site skips a day already posted.
    if: github.event_name != 'schedule' || needs.check.outputs.posted == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pandadev-chi.vercel.app/api/telegram/cron?job=daily-post"
