name: Telegram

# One daily post in the PandaDev Telegram channel (@Kitkatpandamanic) around
# 11:00 Tashkent time: a picture of the problems of the day with hint
# buttons, then the quiz question as polls. The live site builds the post
# (/api/telegram/daily-post), so it matches the site.
# Needs the TELEGRAM_BOT_TOKEN secret.
#
# GitHub's scheduler is best effort: busy hours delay or drop runs, worst at
# the top of the hour. So there are several tries, off the hour, and each one
# first checks whether today's post already went out: exactly one post a day.
on:
  schedule:
    - cron: "3 6 * * *"
    - cron: "21 6 * * *"
    - cron: "43 6 * * *"
    - cron: "13 7 * * *"
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      posted: ${{ steps.runs.outputs.posted }}
    steps:
      - name: Already posted today?
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          posted=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow telegram.yml \
            --status success --created ">=$(date -u +%F)" --json databaseId -q length)
          echo "posted=$posted" >> "$GITHUB_OUTPUT"
          [ "$posted" = "0" ] || echo "Today's post already went out; nothing to do."

  post:
    needs: check
    # Scheduled tries stop once one has posted; a manual run always posts.
    if: github.event_name != 'schedule' || needs.check.outputs.posted == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SITE: https://pandadev-chi.vercel.app
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/telegram
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Post
        run: node scripts/telegram/post.mjs daily
