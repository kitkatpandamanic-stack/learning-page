name: Telegram

# Daily posts in the PandaDev Telegram channel (@Kitkatpandamanic):
# the problem of the day at 11:00 Tashkent time (06:00 UTC) and the quiz
# question at 16:00 (11:00 UTC). The picks come from the live site's
# /api/daily, so they match it. Needs the TELEGRAM_BOT_TOKEN secret.
# GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "What to post"
        type: choice
        options: [morning, quiz]
        default: morning

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SITE: https://pandadev-chi.vercel.app
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/telegram
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            post="${{ inputs.post }}"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            post=morning
          else
            post=quiz
          fi
          node scripts/telegram/post.mjs "$post"
