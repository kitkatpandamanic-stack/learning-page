name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three jobs run side by side: quick checks, the tests (split by language),
# and a production build in which Chrome solves every exercise on the site.
jobs:
  checks:
    name: Format, lint, types and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Known security problems in packages the live site uses fail CI.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python lessons
            languages: python
            files: tests/content.test.ts
          - name: JavaScript lessons
            languages: javascript
            files: tests/content.test.ts
          # TypeScript lessons, plus every other test file (runner, units)
          - name: TypeScript lessons and the rest
            languages: typescript
            files: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Python packages that lessons import (pandas, FastAPI…), downloaded by
      # Pyodide into its own folder the first time the tests need them.
      - if: matrix.languages == 'python'
        uses: actions/cache@v4
        with:
          path: node_modules/pyodide/*.whl
          key: pyodide-packages-${{ hashFiles('package-lock.json') }}
      - run: npx vitest run ${{ matrix.files }}
        env:
          CONTENT_LANGUAGES: ${{ matrix.languages }}

  e2e:
    name: Solve every exercise in Chrome (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python
            languages: python
          - name: JavaScript and TypeScript
            languages: javascript,typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the site
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "The site didn't start" && exit 1
      # Chrome is preinstalled on GitHub's Ubuntu machines.
      - run: npm run test:e2e -- http://localhost:3000 --only=${{ matrix.languages }} --concurrency=4
        env:
          CHROME_PATH: /usr/bin/google-chrome
