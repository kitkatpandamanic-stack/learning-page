name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Python packages that lessons import (pandas, FastAPI…), downloaded by
      # Pyodide into its own folder the first time the tests need them.
      - uses: actions/cache@v4
        with:
          path: node_modules/pyodide/*.whl
          key: pyodide-packages-${{ hashFiles('package-lock.json') }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
