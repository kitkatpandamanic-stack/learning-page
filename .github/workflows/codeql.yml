name: CodeQL

# GitHub's free code scanning for public repositories: looks for security
# bugs (injection, unsafe redirects, leaked data…) in the site's JavaScript and
# TypeScript and the workflows. Findings appear under Security → Code scanning
# and on /admin/health.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The lesson content and generated files aren't the site's code.
          config: |
            paths-ignore:
              - content
              - public/vendor
              - .velite
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
