name: Telegram leaderboard

# On Mondays from 11:30 Tashkent: last week's top learners (who opted in)
# in the channel, posted by the live site (src/app/api/telegram/cron).
# Needs the CRON_SECRET secret (the same value as on Vercel).
#
# GitHub's scheduler is best effort, so there are several tries; each first
# checks whether an earlier one already posted today.
on:
  schedule:
    - cron: "33 6 * * 1"
    - cron: "3 7 * * 1"
    - cron: "33 7 * * 1"
    - cron: "13 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: telegram-leaderboard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      posted: ${{ steps.runs.outputs.posted }}
    steps:
      - name: Already posted today?
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          posted=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow telegram-leaderboard.yml \
            --status success --created ">=$(date -u +%F)" --json databaseId -q length)
          echo "posted=$posted" >> "$GITHUB_OUTPUT"

  post:
    needs: check
    if: github.event_name != 'schedule' || needs.check.outputs.posted == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post the leaderboard
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET isn't set yet; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://pandadev-chi.vercel.app/api/telegram/cron?job=leaderboard"
