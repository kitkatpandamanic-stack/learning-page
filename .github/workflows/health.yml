name: Health

# Collects what /admin/health needs from outside the site (scripts/health/
# collect.mjs): Vercel deployments and secret dates, Neon usage, Sentry
# errors and GitHub security alerts. The tokens for those live here as
# repository secrets and never reach the website; it only gets the numbers.
#
# Secrets: CRON_SECRET (same as on Vercel), VERCEL_TOKEN, NEON_API_KEY,
# SENTRY_READ_TOKEN, HEALTH_GITHUB_TOKEN (fine-grained, "Dependabot alerts:
# read" only: the workflow's own token can't read those). Variables: VERCEL_PROJECT_ID, VERCEL_ORG_ID,
# NEON_PROJECT_ID, SENTRY_ORG, SENTRY_PROJECT, SENTRY_API. Anything missing
# just shows as "not set up" on the page (sh .vercel/push-env.sh health).
#
# GitHub's scheduler is best effort, so this runs twice an hour, off the hour.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The backup workflow's runs and artifact sizes
  actions: read
  # Dependabot and code scanning alerts (read only)
  security-events: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Collect and send to the site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_GITHUB_TOKEN: ${{ secrets.HEALTH_GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_API: ${{ vars.SENTRY_API }}
        run: node scripts/health/collect.mjs
