# Weekly pull requests that keep dependencies up to date. CI runs every
# check (tests, build) on each one before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the Node version the site runs on (24, see package.json)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native compiler: it has no JavaScript API, which
      # the editor's in-browser type checker (and Next.js) need. 6.x is the
      # last JavaScript version.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      # ESLint 10 removed APIs that eslint-config-next's React rules still
      # use (context.getFilename); revisit when eslint-config-next supports it.
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
    groups:
      # Small updates arrive together in one pull request
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
