intro: >-
  Каждый разработчик работает в терминале и сохраняет свою работу в Git.
  Изучите и то, и другое с нуля прямо в браузере, в учебном терминале с
  настоящим Git, ничего не устанавливая: от первой команды ls до веток,
  конфликтов слияния, rebase и командной работы.

levels:
  - level: 0
    summary: Освойтесь в терминале, научитесь работать с файлами и папками и сохраните свой первый проект в Git.
    capstone:
      slug: tidy-project
      title: Порядок в проекте
      description: Наведите порядок в запутанной папке проекта с помощью терминала и сохраните каждый шаг в Git, используя всё из уровня 0.
    modules:
      - slug: terminal-basics
        title: Знакомство с терминалом
        description: Что такое терминал, как устроены команды и как перемещаться по папкам с помощью pwd, ls и cd.
      - slug: files-and-folders
        title: Файлы и папки
        description: Создавайте, читайте, копируйте, перемещайте и удаляйте файлы и папки, а с шаблонами — сразу много.
        project: Порядок в папке «Загрузки»
      - slug: first-repository
        title: Ваш первый репозиторий
        description: Отслеживайте проект в Git, сохраняйте версии коммитами и читайте его историю.
        project: Книга рецептов с историей

  - level: 1
    summary: Объединяйте команды конвейерами, точно видьте, что изменилось, и работайте в ветках, которые потом сливаете.
    capstone:
      slug: team-feature
      title: Командная задача
      description: Сделайте новую возможность в ветке, влейте работу коллеги и разрешите конфликт, используя всё из уровня 1.
    modules:
      - slug: pipes-and-text
        title: Конвейеры и текст
        description: Ищите, считайте и сортируйте текст с grep, wc, sort и uniq и объединяйте команды конвейерами и перенаправлениями.
        project: Отчёт о посещениях по журналу сервера
      - slug: everyday-git
        title: Git каждый день
        description: Смотрите изменения с diff, не пускайте лишние файлы в Git с .gitignore, отменяйте правки и исправляйте последний коммит.
        project: Разбираем беспорядок после работы
      - slug: branches-and-merging
        title: Ветки и слияние
        description: Работайте в ветках, переключайтесь между ними, сливайте их обратно и разрешайте конфликты слияния.
        project: Меню из двух веток

  - level: 2
    summary: Работайте с удалёнными репозиториями как команда, откладывайте работу, отмечайте релизы и следуйте командному процессу.
    capstone:
      slug: release-day
      title: День релиза
      description: Проведите командный релиз от ветки до тега, не отставая от общего удалённого репозитория, используя всё из уровня 2.
    modules:
      - slug: remotes
        title: Удалённые репозитории
        description: clone, fetch, pull и push и как держать свою ветку в актуальном состоянии с origin.
      - slug: stash-and-tags
        title: Stash и теги
        description: Откладывайте незаконченную работу с помощью stash и отмечайте релизы тегами.
      - slug: team-workflows
        title: Командная работа
        description: Ветки для задач, pull request, код-ревью и GitHub flow.
      - slug: scripts-and-environment
        title: Скрипты и окружение
        description: Переменные окружения, PATH, права доступа и первые shell-скрипты.

  - level: 3
    summary: Безопасно переписывайте историю, восстанавливайте что угодно, находите коммит, который всё сломал, и автоматизируйте проверки.
    capstone:
      slug: rescue-the-release
      title: Спасти релиз
      description: Найдите плохой коммит, безопасно отмените его и приведите историю в порядок перед релизом, используя всё из уровня 3.
    modules:
      - slug: rewriting-history
        title: Переписываем историю
        description: rebase, интерактивный rebase, squash и cherry-pick и когда нельзя переписывать общую историю.
      - slug: undo-anything
        title: Отменить что угодно
        description: reset, revert и restore и восстановление потерянных коммитов через reflog.
      - slug: debugging-with-git
        title: Отладка с Git
        description: Находите коммит, который всё сломал, с помощью bisect, а историю строки — с blame и поиском по log.
      - slug: internals-and-automation
        title: Внутреннее устройство и автоматизация
        description: Как Git хранит вашу работу, хуки и автоматические проверки в CI.
