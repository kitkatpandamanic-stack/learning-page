intro: >-
  Every developer works in the terminal and saves their work with Git. Learn
  both from zero right in your browser, in a practice terminal with real Git
  and nothing to install: from your first ls to branches, merge conflicts,
  rebases and team workflows.

levels:
  - level: 0
    summary: Find your way around the terminal, work with files and folders, and save your first project in Git.
    capstone:
      slug: tidy-project
      title: Tidy project
      description: Organise a messy project folder with the terminal and save every step in Git, using everything from Level 0.
    modules:
      - slug: terminal-basics
        title: Meet the Terminal
        description: What a terminal is, how commands work, and finding your way around folders with pwd, ls and cd.
      - slug: files-and-folders
        title: Files & Folders
        description: Make, read, copy, move and delete files and folders, and match many at once with wildcards.
        project: Tidy up a downloads folder
      - slug: first-repository
        title: Your First Repository
        description: Track a project with Git, save versions with commits and read its history.
        project: A recipe book with history

  - level: 1
    summary: Combine commands with pipes, see exactly what changed, and work on branches that you merge back.
    capstone:
      slug: team-feature
      title: Team feature
      description: Build a feature on a branch, merge a teammate's work and resolve the conflict, using everything from Level 1.
    modules:
      - slug: pipes-and-text
        title: Pipes & Text
        description: Search, count and sort text with grep, wc, sort and uniq, and chain commands with pipes and redirects.
        project: A traffic report from the server log
      - slug: everyday-git
        title: Everyday Git
        description: See what changed with diff, keep files out of Git with .gitignore, undo edits and fix your last commit.
        project: Clean up a messy session
      - slug: branches-and-merging
        title: Branches & Merging
        description: Work on branches, switch between them, merge them back and resolve merge conflicts.
        project: A menu from two branches

  - level: 2
    summary: Work with remotes like a team, put work aside, mark releases and follow a team workflow.
    capstone:
      slug: release-day
      title: Release day
      description: Take a team release from branch to tag while staying in sync with a shared remote, using everything from Level 2.
    modules:
      - slug: remotes
        title: Remotes
        description: Clone, fetch, pull and push, and keep your branch in sync with origin.
      - slug: stash-and-tags
        title: Stash & Tags
        description: Put unfinished work aside with stash and mark releases with tags.
      - slug: team-workflows
        title: Team Workflows
        description: Feature branches, pull requests, code review and GitHub flow.
      - slug: scripts-and-environment
        title: Scripts & Environment
        description: Environment variables, PATH, permissions and your first shell scripts.

  - level: 3
    summary: Rewrite history safely, recover anything, find the commit that broke things and automate your checks.
    capstone:
      slug: rescue-the-release
      title: Rescue the release
      description: Find the bad commit, undo it safely and clean up the history before a release, using everything from Level 3.
    modules:
      - slug: rewriting-history
        title: Rewriting History
        description: Rebase, interactive rebase, squash and cherry-pick, and when not to rewrite shared history.
      - slug: undo-anything
        title: Undo Anything
        description: Reset, revert and restore, and recovering lost commits with the reflog.
      - slug: debugging-with-git
        title: Debugging with Git
        description: Find the commit that broke things with bisect, and the story of a line with blame and log search.
      - slug: internals-and-automation
        title: Internals & Automation
        description: How Git stores your work, hooks, and automatic checks in CI.
