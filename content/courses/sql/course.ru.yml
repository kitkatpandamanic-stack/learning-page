intro: >-
  SQL — язык, на котором говорят с базами данных, а база данных есть почти за
  каждым приложением, сайтом и отчётом. Изучайте настоящий PostgreSQL прямо в
  браузере: от первого SELECT до оконных функций, оптимизации запросов и
  проектирования баз данных для продакшена.

levels:
  - level: 0
    summary: Задавайте базе данных первые вопросы, а затем сортируйте, фильтруйте, вычисляйте и обобщайте ответы.
    capstone:
      slug: movie-night
      title: Отчёт для киновечера
      description: Ответьте на вопросы киноклуба о каталоге фильмов и соберите отчёт, используя всё из уровня 0.
    modules:
      - slug: first-queries
        title: Первые запросы
        description: Познакомьтесь с таблицами, строками и столбцами, выбирайте нужные столбцы и фильтруйте строки с WHERE.
      - slug: sorting-and-limiting
        title: Сортировка, лимиты и NULL
        description: Упорядочивайте результаты, показывайте их постранично и работайте с отсутствующими значениями.
      - slug: functions
        title: Текст, числа и даты
        description: Преобразуйте значения встроенными функциями для текста, математики, дат и времени.
      - slug: aggregation
        title: Подсчёт и группировка
        description: Обобщайте данные с COUNT, SUM и AVG, группируйте их с GROUP BY и фильтруйте группы с HAVING.
        project: Сводка продаж магазина

  - level: 1
    summary: Объединяйте таблицы соединениями, пишите запросы внутри запросов, безопасно изменяйте данные и проектируйте свои таблицы.
    capstone:
      slug: shop-analytics
      title: Аналитика интернет-магазина
      description: Ответьте на настоящие бизнес-вопросы об интернет-магазине с помощью соединений, подзапросов и CTE, используя всё из уровня 1.
    modules:
      - slug: joins
        title: Соединение таблиц
        description: Объединяйте строки из нескольких таблиц внутренними, внешними соединениями и самосоединениями.
      - slug: subqueries
        title: Подзапросы и CTE
        description: Используйте запросы внутри запросов, называйте шаги с WITH и объединяйте результаты с UNION.
      - slug: changing-data
        title: Вставка, изменение и удаление
        description: Безопасно добавляйте, изменяйте и удаляйте строки, делайте upsert и объединяйте изменения в транзакции.
      - slug: designing-tables
        title: Проектирование таблиц
        description: Создавайте таблицы с правильными типами, ключами и ограничениями и нормализуйте модель данных.
        project: База данных библиотеки

  - level: 2
    summary: Анализируйте данные как профессионал с оконными функциями и сложными запросами, ускоряйте запросы и создавайте представления, функции и триггеры.
    capstone:
      slug: analytics-dashboard
      title: Запросы для аналитического дашборда
      description: Напишите запросы для продуктового дашборда (рост, удержание, воронки и рейтинги), используя всё из уровня 2.
    modules:
      - slug: window-functions
        title: Оконные функции
        description: Ранжируйте строки, считайте нарастающие итоги и скользящие средние и сравнивайте строку с соседними.
      - slug: advanced-queries
        title: Сложные запросы
        description: Делайте сводные таблицы с CASE и FILTER, обходите иерархии рекурсивными CTE и работайте с JSON и массивами.
      - slug: indexes-and-performance
        title: Индексы и производительность
        description: Читайте планы запросов с EXPLAIN, выбирайте правильные индексы и ускоряйте медленные запросы.
      - slug: views-and-functions
        title: Представления, функции и триггеры
        description: Оформляйте запросы в представления, пишите функции на SQL и PL/pgSQL и реагируйте на изменения триггерами.

  - level: 3
    summary: Освойте транзакции и конкурентный доступ, моделируйте сложные предметные области, защищайте данные и масштабируйте PostgreSQL.
    capstone:
      slug: multi-tenant-saas
      title: База данных для мультитенантного SaaS
      description: Спроектируйте, защитите и оптимизируйте базу данных для мультитенантного SaaS-продукта, используя всё из уровня 3.
    modules:
      - slug: transactions-and-concurrency
        title: Транзакции и конкурентный доступ
        description: Разберитесь в ACID, уровнях изоляции, блокировках и MVCC и избегайте гонок и взаимоблокировок.
      - slug: data-modeling
        title: Продвинутое моделирование данных
        description: Моделируйте историю, иерархии и гибкие данные, обеспечивайте целостность продвинутыми ограничениями и безопасно мигрируйте схемы.
      - slug: security
        title: Безопасность баз данных
        description: Управляйте ролями и правами, защищайтесь от SQL-инъекций и изолируйте данные пользователей с row-level security.
      - slug: scaling
        title: Масштабирование и эксплуатация
        description: Секционируйте большие таблицы, планируйте резервное копирование и репликацию и выбирайте подходящую базу данных.
