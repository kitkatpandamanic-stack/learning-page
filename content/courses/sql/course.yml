intro: >-
  SQL is how you talk to databases, and almost every app, website and report
  has one behind it. Learn real PostgreSQL right in your browser: from your
  first SELECT to window functions, performance tuning and production-grade
  database design.

levels:
  - level: 0
    summary: Ask your first questions of a database, then sort, filter, calculate and summarise the answers.
    capstone:
      slug: movie-night
      title: Movie night report
      description: Answer a film club's questions about a movie catalogue and build a report, using everything from Level 0.
    modules:
      - slug: first-queries
        title: Your First Queries
        description: Meet tables, rows and columns, choose the columns you want and filter rows with WHERE.
      - slug: sorting-and-limiting
        title: Sorting, Limiting & NULL
        description: Put results in order, show them a page at a time and handle missing values.
      - slug: functions
        title: Text, Numbers & Dates
        description: Transform values with built-in functions for text, maths, dates and times.
      - slug: aggregation
        title: Counting & Grouping
        description: Summarise data with COUNT, SUM and AVG, group it with GROUP BY and filter groups with HAVING.
        project: Shop sales summary

  - level: 1
    summary: Combine tables with joins, write queries inside queries, change data safely and design your own tables.
    capstone:
      slug: shop-analytics
      title: Online shop analytics
      description: Answer real business questions about an online shop with joins, subqueries and CTEs, using everything from Level 1.
    modules:
      - slug: joins
        title: Joining Tables
        description: Combine rows from several tables with inner, outer and self joins.
      - slug: subqueries
        title: Subqueries & CTEs
        description: Use queries inside queries, name steps with WITH, and combine results with UNION.
      - slug: changing-data
        title: Inserting, Updating & Deleting
        description: Add, change and remove rows safely, upsert, and group changes in transactions.
      - slug: designing-tables
        title: Designing Tables
        description: Create tables with the right types, keys and constraints, and normalise your data model.
        project: Library database

  - level: 2
    summary: Analyse data like a pro with window functions and advanced queries, make queries fast, and build views, functions and triggers.
    capstone:
      slug: analytics-dashboard
      title: Analytics dashboard queries
      description: Write the queries behind a product dashboard (growth, retention, funnels and rankings), using everything from Level 2.
    modules:
      - slug: window-functions
        title: Window Functions
        description: Rank rows, compute running totals and moving averages, and compare each row with its neighbours.
      - slug: advanced-queries
        title: Advanced Queries
        description: Pivot with CASE and FILTER, walk hierarchies with recursive CTEs, and work with JSON and arrays.
      - slug: indexes-and-performance
        title: Indexes & Performance
        description: Read query plans with EXPLAIN, choose the right indexes and tune slow queries.
      - slug: views-and-functions
        title: Views, Functions & Triggers
        description: Package queries as views, write functions in SQL and PL/pgSQL, and react to changes with triggers.

  - level: 3
    summary: Master transactions and concurrency, model complex domains, secure your data and run PostgreSQL at scale.
    capstone:
      slug: multi-tenant-saas
      title: Design a multi-tenant SaaS database
      description: Design, secure and optimise the database for a multi-tenant SaaS product, using everything from Level 3.
    modules:
      - slug: transactions-and-concurrency
        title: Transactions & Concurrency
        description: Understand ACID, isolation levels, locks and MVCC, and avoid race conditions and deadlocks.
      - slug: data-modeling
        title: Advanced Data Modelling
        description: Model history, hierarchies and flexible data, enforce integrity with advanced constraints, and migrate schemas safely.
      - slug: security
        title: Database Security
        description: Manage roles and privileges, stop SQL injection and isolate users' data with row-level security.
      - slug: scaling
        title: Scaling & Operations
        description: Partition big tables, plan backups and replication, and choose the right database for the job.
