intro: >-
  TypeScript — это JavaScript с типами. Компилятор находит ошибки ещё до того,
  как код запустится, поэтому его используют в большинстве крупных
  веб-проектов. Изучите его с нуля, а в конце научитесь проектировать
  типобезопасные библиотеки и архитектуры.

levels:
  - level: 0
    summary: Учимся программировать с типами, чтобы компилятор ловил ошибки как можно раньше.
    capstone:
      slug: quiz-game
      title: Типизированная игра-викторина
      description: Опишите викторину с помощью типов, безопасно проверяйте ответы и выводите отчёт о результатах — используя всё, что изучили на Уровне 0.
    modules:
      - slug: basics
        title: Основы TypeScript
        description: Настраиваем TypeScript, пишем первую типизированную программу и знакомимся с базовыми типами.
        project: Типизированный генератор приветствий
      - slug: control-flow
        title: Управление потоком
        description: Используем условия и циклы и смотрим, как TypeScript сужает типы при ветвлении кода.
      - slug: functions
        title: Типизированные функции
        description: Типизируем параметры и возвращаемые значения, используем необязательные аргументы и значения по умолчанию.
        project: Типизированный калькулятор
      - slug: arrays-and-objects
        title: Массивы, объекты и интерфейсы
        description: Описываем форму данных с помощью интерфейсов и псевдонимов типов.
        project: Записная книжка контактов

  - level: 1
    summary: Моделируем реальные данные с помощью объединений, дженериков и классов.
    capstone: Типизированный менеджер задач в браузере
    modules:
      - slug: unions-and-narrowing
        title: Объединения и сужение типов
        description: Комбинируем типы, безопасно сужаем их и используем размеченные объединения.
      - slug: classes
        title: Классы и модификаторы доступа
        description: Создаём классы с членами public, private и readonly и реализуем интерфейсы.
      - slug: generics
        title: Дженерики
        description: Пишем переиспользуемые типобезопасные функции и структуры данных.
        project: Обобщённое хранилище данных
      - slug: dom-and-tooling
        title: DOM, модули и инструменты
        description: Типизируем DOM, раскладываем код по модулям и настраиваем tsconfig.

  - level: 2
    summary: Выпускаем типизированные приложения с асинхронным кодом, React, API и тестами.
    capstone: Типизированное full-stack-приложение на React и Node API
    modules:
      - slug: async-and-apis
        title: Асинхронность и типизированные API
        description: Типизируем промисы, вызовы fetch и ответы API с проверкой во время выполнения.
      - slug: react
        title: React и TypeScript
        description: Типизируем props, состояние, события и хуки в React-компонентах.
        project: Типизированная канбан-доска
      - slug: node
        title: Node.js и TypeScript
        description: Создаём типизированный REST API и делим типы между клиентом и сервером.
      - slug: testing
        title: Тестирование
        description: Тестируем типизированный код с Vitest и следим, чтобы типы в тестах оставались честными.

  - level: 3
    summary: Осваиваем систему типов и проектируем большие кодовые базы.
    capstone: Типобезопасный SDK для публичного API с публикацией в npm
    modules:
      - slug: advanced-types
        title: Продвинутые типы
        description: Условные, отображённые и шаблонные литеральные типы, а также infer.
      - slug: type-level-programming
        title: Программирование на уровне типов
        description: Создаём собственные служебные типы и разбираемся с вариантностью и выводом типов.
      - slug: architecture
        title: Архитектура в масштабе
        description: Монорепозитории, ссылки между проектами, проектирование API и стратегии миграции.
      - slug: build-performance
        title: Производительность компилятора и сборки
        description: Ускоряем проверку типов и сборку в больших проектах.
      - slug: leadership
        title: Код-ревью и наставничество
        description: Задаём стандарты, проверяем типизированный код и ведём внедрение TypeScript в команде.
