intro: >-
  TypeScript — это JavaScript с типами. Компилятор находит ошибки ещё до того,
  как код запустится, поэтому его используют в большинстве крупных
  веб-проектов. Изучите его с нуля, а в конце научитесь проектировать
  типобезопасные библиотеки и архитектуры.

levels:
  - level: 0
    summary: Учимся программировать с типами, чтобы компилятор ловил ошибки как можно раньше.
    capstone:
      slug: quiz-game
      title: Типизированная игра-викторина
      description: Опишите викторину с помощью типов, безопасно проверяйте ответы и выводите отчёт о результатах — используя всё, что изучили на Уровне 0.
    modules:
      - slug: basics
        title: Основы TypeScript
        description: Настраиваем TypeScript, пишем первую типизированную программу и знакомимся с базовыми типами.
        project: Типизированный генератор приветствий
      - slug: control-flow
        title: Управление потоком
        description: Используем условия и циклы и смотрим, как TypeScript сужает типы при ветвлении кода.
      - slug: functions
        title: Типизированные функции
        description: Типизируем параметры и возвращаемые значения, используем необязательные аргументы и значения по умолчанию.
        project: Типизированный калькулятор
      - slug: arrays-and-objects
        title: Массивы, объекты и интерфейсы
        description: Описываем форму данных с помощью интерфейсов и псевдонимов типов.
        project: Записная книжка контактов

  - level: 1
    summary: Моделируем реальные данные с помощью объединений, классов и дженериков и типизируем браузер.
    capstone:
      slug: habit-tracker
      title: Типизированный трекер привычек в браузере
      description: Создайте трекер привычек с типизированными привычками и отметками, сериями дней, дженерик-хранилищем в localStorage и типизированной страницей — используя всё, что изучили на Уровне 1.
    modules:
      - slug: unions-and-narrowing
        title: Объединения и сужение типов
        description: Комбинируем типы, безопасно сужаем их, описываем состояния размеченными объединениями и пишем собственные защитники типов.
        project: Обработчик статусов платежей
      - slug: classes
        title: Классы и модификаторы доступа
        description: Создаём классы с членами public, private и readonly, реализуем интерфейсы и разбираемся в структурной типизации.
        project: Парковка
      - slug: generics
        title: Дженерики
        description: Пишем переиспользуемые типобезопасные функции, типы и классы и используем встроенные утилитные типы.
        project: Дженерик-хранилище данных
      - slug: dom-and-tooling
        title: DOM, модули и инструменты
        description: Типизируем DOM и события, раскладываем код по модулям, используем файлы объявлений и настраиваем tsconfig.

  - level: 2
    summary: Создаём типизированные приложения с асинхронным кодом, тестами, React и API на Node.
    capstone:
      slug: fullstack-todos
      title: Типизированное full-stack приложение со списком дел
      description: Создайте приложение со списком дел с общими типами, Express API с валидацией и тестами, типизированным API-клиентом и клиентом на React — используя всё, что изучили на Уровне 2.
    modules:
      - slug: async-and-apis
        title: Асинхронность и типизированные API
        description: Типизируем промисы и запросы fetch и проверяем данные во время выполнения, чтобы типы не врали.
        project: Типизированный API-клиент
      - slug: testing
        title: Тестирование типизированного кода
        description: Тестируем TypeScript с Vitest, типизируем моки и фейки и тестируем сами типы.
      - slug: react
        title: React и TypeScript
        description: Типизируем пропсы, состояние, события, формы, редьюсеры, контекст и собственные хуки в React-компонентах.
        project: Типизированная канбан-доска
      - slug: node
        title: Node.js и Express на TypeScript
        description: Создаём типизированный Express API с валидацией и обработкой ошибок и делим один контракт API между сервером и клиентом.
        project: Типизированный API заметок

  - level: 3
    summary: Осваиваем систему типов в совершенстве и учимся проектировать, создавать и развивать большие кодовые базы на TypeScript.
    capstone:
      slug: typed-sdk
      title: Типобезопасный SDK для публичного API
      description: Спроектируйте и создайте SDK, типы которого выводятся из одного описания API, с типизированными ошибками, повторными попытками, пагинацией, тестами типов и планом публикации в npm — используя всё, что изучили на Уровне 3.
    modules:
      - slug: advanced-types
        title: Продвинутые типы
        description: Условные типы и infer, сопоставленные типы с переназначением ключей и шаблонные литеральные типы.
      - slug: type-level-programming
        title: Программирование на уровне типов
        description: Создаём собственные утилитные типы, разбираемся в вариантности и выводе типов и проектируем типобезопасные API с брендированными типами.
      - slug: architecture
        title: Архитектура в больших проектах
        description: Проектируем типы для больших кодовых баз, организуем монорепозитории со ссылками на проекты и планируем изменения API и миграции.
      - slug: build-performance
        title: Компилятор и скорость сборки
        description: Как устроен компилятор, как сохранить быструю проверку типов и как собирать и публиковать пакеты на TypeScript.
      - slug: leadership
        title: Код-ревью и лидерство
        description: Проводим качественное ревью кода на TypeScript, задаём стандарты команды и руководим внедрением TypeScript.
