intro: >-
  TypeScript is JavaScript with types. The compiler catches mistakes before
  your code even runs, which is why most large web projects use it. Learn it
  from scratch and finish by designing type-safe libraries and architectures.

levels:
  - level: 0
    summary: Learn to program with types, so the compiler catches your mistakes early.
    capstone:
      slug: quiz-game
      title: Typed quiz game
      description: Model a quiz with types, grade answers safely and print a results report, using everything from Level 0.
    modules:
      - slug: basics
        title: TypeScript Basics
        description: Set up TypeScript, write your first typed program and meet the basic types.
        project: Typed greeting generator
      - slug: control-flow
        title: Control Flow
        description: Use conditions and loops, and see how TypeScript narrows types as your code branches.
      - slug: functions
        title: Typed Functions
        description: Type parameters and return values, and use optional and default arguments.
        project: Typed calculator
      - slug: arrays-and-objects
        title: Arrays, Objects & Interfaces
        description: Describe the shape of your data with interfaces and type aliases.
        project: Contact book

  - level: 1
    summary: Model real data with unions, classes and generics, and type the browser.
    capstone:
      slug: habit-tracker
      title: Typed habit tracker in the browser
      description: Build a habit tracker with typed habits and check-ins, streaks, a generic store saved in localStorage and a typed page, using everything from Level 1.
    modules:
      - slug: unions-and-narrowing
        title: Unions & Narrowing
        description: Combine types, narrow them safely, model states with discriminated unions and write your own type guards.
        project: Payment status handler
      - slug: classes
        title: Classes & Access Modifiers
        description: Build classes with public, private and readonly members, implement interfaces and see how structural typing works.
        project: Parking garage
      - slug: generics
        title: Generics
        description: Write reusable, type-safe functions, types and classes, and use the built-in utility types.
        project: Generic data store
      - slug: dom-and-tooling
        title: DOM, Modules & Tooling
        description: Type the DOM and events, organise code into modules, use declaration files and configure tsconfig.

  - level: 2
    summary: Ship typed applications with async code, tests, React and Node APIs.
    capstone:
      slug: fullstack-todos
      title: Full-stack typed to-do app
      description: Build a to-do app with shared types, a validated Express API with tests, a typed API client and a React client, using everything from Level 2.
    modules:
      - slug: async-and-apis
        title: Async & Typed APIs
        description: Type promises and fetch calls, and validate data at runtime so your types stay true.
        project: Typed API client
      - slug: testing
        title: Testing Typed Code
        description: Test TypeScript with Vitest, type your mocks and fakes, and test the types themselves.
      - slug: react
        title: React with TypeScript
        description: Type props, state, events, forms, reducers, context and custom hooks in React components.
        project: Typed kanban board
      - slug: node
        title: Node.js & Express with TypeScript
        description: Build a typed Express API with validation and errors, and share one API contract between server and client.
        project: Typed notes API

  - level: 3
    summary: Master the type system and design, build and lead large TypeScript codebases.
    capstone:
      slug: typed-sdk
      title: Type-safe SDK for a public API
      description: Design and build an SDK whose types come from one API description, with typed errors, retries and pagination, type tests and a plan to publish it to npm, using everything from Level 3.
    modules:
      - slug: advanced-types
        title: Advanced Types
        description: Conditional types and infer, mapped types with key remapping, and template literal types.
      - slug: type-level-programming
        title: Type-Level Programming
        description: Build your own utility types, understand variance and inference, and design type-safe APIs with branded types.
      - slug: architecture
        title: Architecture at Scale
        description: Design types for large codebases, structure monorepos with project references, and plan API changes and migrations.
      - slug: build-performance
        title: Compiler & Build Performance
        description: How the compiler works, how to keep type checking fast, and how to build and publish TypeScript packages.
      - slug: leadership
        title: Code Review & Leadership
        description: Review TypeScript code well, set team standards and lead TypeScript adoption.
