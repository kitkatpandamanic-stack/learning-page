intro: >-
  TypeScript is JavaScript with types. The compiler catches mistakes before
  your code even runs, which is why most large web projects use it. Learn it
  from scratch and finish by designing type-safe libraries and architectures.

levels:
  - level: 0
    summary: Learn to program with types, so the compiler catches your mistakes early.
    capstone:
      slug: quiz-game
      title: Typed quiz game
      description: Model a quiz with types, grade answers safely and print a results report, using everything from Level 0.
    modules:
      - slug: basics
        title: TypeScript Basics
        description: Set up TypeScript, write your first typed program and meet the basic types.
        project: Typed greeting generator
      - slug: control-flow
        title: Control Flow
        description: Use conditions and loops, and see how TypeScript narrows types as your code branches.
      - slug: functions
        title: Typed Functions
        description: Type parameters and return values, and use optional and default arguments.
        project: Typed calculator
      - slug: arrays-and-objects
        title: Arrays, Objects & Interfaces
        description: Describe the shape of your data with interfaces and type aliases.
        project: Contact book

  - level: 1
    summary: Model real data with unions, generics and classes.
    capstone: Typed task manager in the browser
    modules:
      - slug: unions-and-narrowing
        title: Unions & Narrowing
        description: Combine types, narrow them safely and use discriminated unions.
      - slug: classes
        title: Classes & Access Modifiers
        description: Build classes with public, private and readonly members, and implement interfaces.
      - slug: generics
        title: Generics
        description: Write reusable, type-safe functions and data structures.
        project: Generic data store
      - slug: dom-and-tooling
        title: DOM, Modules & Tooling
        description: Type the DOM, organise code into modules and configure tsconfig.

  - level: 2
    summary: Ship typed applications with async code, React, APIs and testing.
    capstone: Full-stack typed app with React and a Node API
    modules:
      - slug: async-and-apis
        title: Async & Typed APIs
        description: Type promises, fetch calls and API responses, with validation at runtime.
      - slug: react
        title: React with TypeScript
        description: Type props, state, events and hooks in React components.
        project: Typed kanban board
      - slug: node
        title: Node.js with TypeScript
        description: Build a typed REST API and share types between client and server.
      - slug: testing
        title: Testing
        description: Test typed code with Vitest and keep your types honest in tests.

  - level: 3
    summary: Master the type system and design large codebases.
    capstone: Type-safe SDK for a public API, published to npm
    modules:
      - slug: advanced-types
        title: Advanced Types
        description: Conditional, mapped and template literal types, plus infer.
      - slug: type-level-programming
        title: Type-Level Programming
        description: Build your own utility types and understand variance and inference.
      - slug: architecture
        title: Architecture at Scale
        description: Monorepos, project references, API design and migration strategies.
      - slug: build-performance
        title: Compiler & Build Performance
        description: Speed up type checking and builds in large projects.
      - slug: leadership
        title: Code Review & Mentoring
        description: Set standards, review typed code and lead TypeScript adoption in a team.
