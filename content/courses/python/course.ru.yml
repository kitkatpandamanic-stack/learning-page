intro: >-
  Python читается почти как обычный английский текст, поэтому это отличный первый язык.
  А ещё это язык анализа данных, ИИ, автоматизации и множества бэкендов.
  Пройдите путь от первого выведенного сообщения до проектирования продакшен-систем.

levels:
  - level: 0
    summary: Напишите первые программы на Python со значениями, условиями, циклами и функциями.
    capstone:
      slug: text-adventure
      title: Текстовая приключенческая игра
      description: Соберите текстовую игру-приключение с комнатами, инвентарём и условием победы, используя всё из Уровня 0.
    modules:
      - slug: basics
        title: Основы Python
        description: Запускайте Python, выводите текст, храните значения в переменных и работайте с основными типами данных.
        project: Генератор историй Mad Libs
      - slug: conditions
        title: Операторы и условия
        description: Сравнивайте значения и делайте выбор с помощью if, elif и else.
        project: Камень, ножницы, бумага
      - slug: loops
        title: Циклы
        description: Повторяйте действия с for и while, используйте range() и вовремя останавливайтесь.
        project: Тренажёр таблицы умножения
      - slug: functions
        title: Функции
        description: Пишите переиспользуемые функции с параметрами, возвращаемыми значениями и аргументами по умолчанию.
        project: Конвертер единиц измерения

  - level: 1
    summary: Работайте с реальными данными с помощью коллекций, файлов, классов и стандартной библиотеки.
    capstone:
      slug: expense-tracker
      title: Консольный трекер расходов с сохранением в файлы
      description: Соберите трекер расходов с классами, проверкой данных, отчётами и файлами CSV/JSON, используя всё из Уровня 1.
    modules:
      - slug: collections
        title: Списки, словари, множества и кортежи
        description: Выбирайте подходящую коллекцию и преобразуйте данные с помощью списковых включений.
        project: Счётчик частоты слов
      - slug: files-and-exceptions
        title: Файлы и исключения
        description: Читайте и записывайте текстовые, CSV- и JSON-файлы и аккуратно обрабатывайте ошибки.
      - slug: classes
        title: Классы и ООП
        description: Моделируйте мир с помощью классов, наследования и специальных (dunder) методов.
        project: Система управления библиотекой
      - slug: modules-and-packages
        title: Модули, pip и виртуальные окружения
        description: Разбивайте код на модули, устанавливайте пакеты и изолируйте проекты друг от друга.
      - slug: text-and-automation
        title: Текст, даты и автоматизация
        description: Ищем шаблоны в тексте регулярными выражениями, работаем с датами и часовыми поясами и автоматизируем работу с файлами.
        project: Анализатор лог-файлов
      - slug: algorithms
        title: Алгоритмы и структуры данных
        description: Мыслим рекурсивно, оцениваем скорость через Big-O, ищем и сортируем и выбираем подходящую структуру данных.
        project: Поиск выхода из лабиринта

  - level: 2
    summary: Создавайте настоящие приложения с веб-API, базами данных, тестами и асинхронностью и анализируйте данные с pandas и машинным обучением.
    capstone:
      slug: rest-api
      title: REST API на FastAPI с базой данных и полным покрытием тестами
      description: Создайте REST API для проектов и задач на FastAPI и SQLAlchemy с полным набором тестов pytest, используя всё из уровня 2.
    modules:
      - slug: power-tools
        title: Аннотации типов, декораторы и генераторы
        description: Пишите современный Python с аннотациями типов, декораторами, генераторами и менеджерами контекста.
      - slug: testing
        title: Тестирование с pytest
        description: Пишите тесты, используйте фикстуры и моки и измеряйте покрытие.
      - slug: web-apis
        title: Веб-API на FastAPI
        description: Создавайте типизированные REST API с валидацией и автоматической документацией.
        project: API списка дел
      - slug: databases
        title: Базы данных и SQLAlchemy
        description: Моделируйте данные, пишите запросы и управляйте миграциями базы данных.
      - slug: async
        title: Асинхронный Python
        description: Используйте asyncio, чтобы выполнять много задач одновременно без потоков.
      - slug: data-analysis
        title: Анализ данных с pandas
        description: Загружайте, очищайте, анализируйте и визуализируйте реальные наборы данных.
        project: Анализ открытого набора данных
      - slug: machine-learning
        title: Машинное обучение
        description: Считаем с массивами NumPy, обучаем первые модели в scikit-learn и честно измеряем, насколько они хороши.
        project: Детектор спама

  - level: 3
    summary: Освойте язык в совершенстве и ведите проекты, разбираясь во внутреннем устройстве, производительности и архитектуре.
    capstone:
      slug: production-service
      title: Спроектируйте и разверните масштабируемый сервис, готовый к продакшену
      description: Спроектируйте, создайте и выпустите сервис сокращения ссылок с чистой архитектурой, защитой, кешированием, ограничением частоты запросов и конвейером развёртывания, используя всё из уровня 3.
    modules:
      - slug: internals
        title: Внутреннее устройство Python
        description: Интерпретатор, GIL, управление памятью, дескрипторы и метаклассы.
      - slug: performance
        title: Производительность и конкурентность
        description: Профилируйте код и используйте multiprocessing, кеширование и нативные расширения там, где это важно.
      - slug: architecture
        title: Архитектура и паттерны проектирования
        description: Структурируйте большие кодовые базы с помощью чистой архитектуры, предметно-ориентированного проектирования и внедрения зависимостей.
      - slug: security-and-deployment
        title: Безопасность и развёртывание
        description: Защищайте приложения, упаковывайте их в контейнеры и надёжно запускайте в продакшене.
      - slug: system-design
        title: Системный дизайн и лидерство
        description: Проектируйте распределённые системы, проводите код-ревью и наставляйте команду.
