intro: >-
  Python reads almost like English, which makes it a great first language.
  It is also the language of data science, AI, automation and many backends.
  Go from printing your first message to designing production systems.

levels:
  - level: 0
    summary: Write your first Python programs with values, decisions, loops and functions.
    capstone:
      slug: text-adventure
      title: Text adventure game
      description: Build a playable text adventure with rooms, an inventory and a win condition, using everything from Level 0.
    modules:
      - slug: basics
        title: Python Basics
        description: Run Python, print output, store values in variables and use the main data types.
        project: Mad Libs story generator
      - slug: conditions
        title: Operators & Decisions
        description: Compare values and make choices with if, elif and else.
        project: Rock, paper, scissors
      - slug: loops
        title: Loops
        description: Repeat work with for and while, use range() and stop when you are done.
        project: Times-table quiz
      - slug: functions
        title: Functions
        description: Write reusable functions with parameters, return values and default arguments.
        project: Unit converter

  - level: 1
    summary: Handle real data with collections, files, classes and the standard library.
    capstone:
      slug: expense-tracker
      title: Command-line expense tracker that saves to files
      description: Build an expense tracker with classes, validation, reports and CSV/JSON files, using everything from Level 1.
    modules:
      - slug: collections
        title: Lists, Dicts, Sets & Tuples
        description: Choose the right collection and transform data with comprehensions.
        project: Word frequency counter
      - slug: files-and-exceptions
        title: Files & Exceptions
        description: Read and write text, CSV and JSON files and handle errors gracefully.
      - slug: classes
        title: Classes & OOP
        description: Model the world with classes, inheritance and special (dunder) methods.
        project: Library management system
      - slug: modules-and-packages
        title: Modules, pip & Virtual Environments
        description: Organise code into modules, install packages and keep projects isolated.
      - slug: text-and-automation
        title: Text, Dates & Automation
        description: Find patterns in text with regular expressions, work with dates and time zones, and automate files.
        project: Log file analyser
      - slug: algorithms
        title: Algorithms & Data Structures
        description: Think recursively, measure speed with Big-O, search and sort, and pick the right data structure.
        project: Maze solver

  - level: 2
    summary: Build real applications with web APIs, databases, testing and async, and analyse data with pandas and machine learning.
    capstone:
      slug: rest-api
      title: REST API with FastAPI, a database and full test coverage
      description: Build a projects-and-tasks REST API with FastAPI, SQLAlchemy and a full pytest suite, using everything from Level 2.
    modules:
      - slug: power-tools
        title: Type Hints, Decorators & Generators
        description: Write modern Python with type hints, decorators, generators and context managers.
      - slug: testing
        title: Testing with pytest
        description: Write tests, use fixtures and mocks, and measure coverage.
      - slug: web-apis
        title: Web APIs with FastAPI
        description: Build typed REST APIs with validation and automatic documentation.
        project: To-do API
      - slug: databases
        title: Databases & SQLAlchemy
        description: Model data, write queries and manage database migrations.
      - slug: async
        title: Async Python
        description: Use asyncio to handle many tasks at once without threads.
      - slug: data-analysis
        title: Data Analysis with pandas
        description: Load, clean, analyse and plot real datasets.
        project: Analyse a public dataset
      - slug: machine-learning
        title: Machine Learning
        description: Compute with NumPy arrays, train your first models with scikit-learn and measure how good they really are.
        project: Spam detector

  - level: 3
    summary: Master the language and lead projects through internals, performance and architecture.
    capstone:
      slug: production-service
      title: Design and deploy a scalable, production-ready service
      description: Design, build and ship a URL shortener service with clean architecture, security, caching, rate limiting and a deployment pipeline, using everything from Level 3.
    modules:
      - slug: internals
        title: Python Internals
        description: The interpreter, the GIL, memory management, descriptors and metaclasses.
      - slug: performance
        title: Performance & Concurrency
        description: Profile code and use multiprocessing, caching and native extensions where it counts.
      - slug: architecture
        title: Architecture & Design Patterns
        description: Structure large codebases with clean architecture, domain-driven design and dependency injection.
      - slug: security-and-deployment
        title: Security & Deployment
        description: Secure your apps, package them in containers and run them reliably in production.
      - slug: system-design
        title: System Design & Leadership
        description: Design distributed systems, review code and mentor your team.
