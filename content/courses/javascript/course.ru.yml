intro: >-
  JavaScript работает на каждом интерактивном сайте, а ещё на серверах, в мобильных
  приложениях и не только. Начните с самой первой строки кода и дойдите до
  проектирования больших, быстрых и безопасных приложений.

levels:
  - level: 0
    summary: Напишите первые программы со значениями, условиями, циклами и функциями.
    capstone:
      slug: number-guessing-game
      title: Игра «Угадай число» в браузере
      description: Шаг за шагом соберите полноценную игру — от игровой логики до страницы, на которой в неё можно играть, — используя всё из Уровня 0.
    modules:
      - slug: basics
        title: Основы JavaScript
        description: Запустите свой первый код, сохраните значения в переменных и познакомьтесь с основными типами данных.
        project: Генератор персональных открыток
      - slug: operators-and-conditions
        title: Операторы и условия
        description: Считайте, сравнивайте значения и учите программу выбирать с помощью if/else и switch.
        project: Калькулятор оценок
      - slug: loops
        title: Циклы
        description: Повторяйте действия с помощью for, while и for…of вместо копирования одной и той же строки.
        project: Таблица умножения
      - slug: functions
        title: Функции
        description: Упаковывайте логику в переиспользуемые функции с параметрами, возвращаемыми значениями и областью видимости.
        project: Калькулятор чаевых и разделения счёта

  - level: 1
    summary: Работайте с реальными данными и браузером с помощью массивов, объектов, DOM и модулей.
    capstone:
      slug: todo-app
      title: Интерактивный список дел, который помнит ваши задачи
      description: Создайте настоящее приложение для списка дел — с добавлением, выполнением, фильтрацией и удалением задач и сохранением в localStorage, — используя всё из Уровня 1.
    modules:
      - slug: arrays-and-objects
        title: Массивы и объекты
        description: Храните коллекции, преобразуйте их с помощью map, filter и reduce и описывайте данные объектами.
        project: Анализатор списка покупок
      - slug: dom-and-events
        title: DOM и события
        description: Находите элементы, изменяйте страницу и реагируйте на клики, ввод текста и формы.
        project: Выбор цвета с живым предпросмотром
      - slug: errors-and-debugging
        title: Ошибки и отладка
        description: Читайте сообщения об ошибках, пользуйтесь отладчиком и обрабатывайте сбои с помощью try/catch.
      - slug: classes
        title: Классы и ООП
        description: Создавайте шаблоны объектов с помощью классов, наследования, геттеров и сеттеров.
        project: Симулятор банковского счёта
      - slug: modules-and-tooling
        title: Модули, npm и Git
        description: Разбивайте код на модули, устанавливайте пакеты через npm и отслеживайте изменения в Git.

  - level: 2
    summary: Пишите код production-уровня с асинхронностью, API, тестами и фреймворком.
    capstone: Панель погоды на React с публичным API и тестами
    modules:
      - slug: async
        title: Асинхронный JavaScript
        description: Колбэки, промисы и async/await — и что происходит, пока ваш код ждёт.
      - slug: fetch-and-apis
        title: Fetch и REST API
        description: Обращайтесь к веб-API, работайте с JSON, обрабатывайте состояния загрузки и ошибки.
        project: Приложение для поиска фильмов
      - slug: testing
        title: Тестирование с Vitest
        description: Пишите модульные тесты, подменяйте зависимости моками и практикуйте разработку через тестирование (TDD).
      - slug: react
        title: Основы React
        description: Компоненты, props, состояние и эффекты для создания современных пользовательских интерфейсов.
        project: Каталог рецептов
      - slug: node-and-express
        title: Node.js и Express
        description: Создайте REST API на сервере и подключите его к базе данных.
        project: API для заметок

  - level: 3
    summary: Думайте как архитектор — о внутреннем устройстве, производительности, безопасности и масштабировании.
    capstone: Спроектируйте, создайте и разверните чат-платформу в реальном времени
    modules:
      - slug: engine-internals
        title: Устройство движка и цикл событий
        description: Как движки JavaScript выполняют ваш код — от стека вызовов и очередей задач до памяти и сборки мусора.
      - slug: design-patterns
        title: Паттерны проектирования и архитектура
        description: Применяйте SOLID, распространённые паттерны проектирования и чистую архитектуру в больших кодовых базах.
      - slug: performance
        title: Производительность
        description: Находите и исправляйте медленный код с помощью профилирования, Core Web Vitals, сборки бандлов и кеширования.
      - slug: security
        title: Безопасность
        description: Защищайтесь от XSS, CSRF и инъекций и безопасно работайте с аутентификацией и секретами.
      - slug: system-design
        title: Проектирование систем и лидерство
        description: Проектируйте масштабируемые системы, проводите отличные код-ревью и наставляйте других разработчиков.
