intro: >-
  JavaScript runs every interactive website, plus servers, mobile apps and more.
  Start with your very first line of code and work up to architecting large,
  fast and secure applications.

levels:
  - level: 0
    summary: Write your first programs with values, decisions, loops and functions.
    capstone: Number-guessing game in the browser
    modules:
      - slug: basics
        title: JavaScript Basics
        description: Run your first code, store values in variables and meet the main data types.
        project: Personal greeting card generator
      - slug: operators-and-conditions
        title: Operators & Decisions
        description: Do maths, compare values and make your programs choose with if/else and switch.
        project: Grade calculator
      - slug: loops
        title: Loops
        description: Repeat work with for, while and for…of instead of copying the same line.
        project: Multiplication table printer
      - slug: functions
        title: Functions
        description: Package logic into reusable functions with parameters, return values and scope.
        project: Tip and bill splitter

  - level: 1
    summary: Work with real data and the browser using arrays, objects, the DOM and modules.
    capstone: Interactive to-do app that remembers your tasks
    modules:
      - slug: arrays-and-objects
        title: Arrays & Objects
        description: Store collections, transform them with map, filter and reduce, and model data with objects.
        project: Shopping list analyser
      - slug: dom-and-events
        title: The DOM & Events
        description: Select elements, change the page and react to clicks, typing and forms.
        project: Colour picker with live preview
      - slug: errors-and-debugging
        title: Errors & Debugging
        description: Read error messages, use the debugger and handle failures with try/catch.
      - slug: classes
        title: Classes & OOP
        description: Create blueprints with classes, inheritance, getters and setters.
        project: Bank account simulator
      - slug: modules-and-tooling
        title: Modules, npm & Git
        description: Split code into modules, install packages with npm and track changes with Git.

  - level: 2
    summary: Write production-quality code with async, APIs, testing and a framework.
    capstone: Weather dashboard with React, a public API and tests
    modules:
      - slug: async
        title: Asynchronous JavaScript
        description: Callbacks, promises and async/await, and what happens while your code waits.
      - slug: fetch-and-apis
        title: Fetch & REST APIs
        description: Call web APIs, work with JSON and handle loading states and errors.
        project: Movie search app
      - slug: testing
        title: Testing with Vitest
        description: Write unit tests, mock dependencies and practise test-driven development.
      - slug: react
        title: React Fundamentals
        description: Components, props, state and effects for building modern user interfaces.
        project: Recipe browser
      - slug: node-and-express
        title: Node.js & Express
        description: Build a REST API on the server and connect it to a database.
        project: Notes API

  - level: 3
    summary: Think like an architect about internals, performance, security and scale.
    capstone: Design, build and deploy a real-time chat platform
    modules:
      - slug: engine-internals
        title: Engine Internals & the Event Loop
        description: How JavaScript engines run your code, from the call stack and task queues to memory and garbage collection.
      - slug: design-patterns
        title: Design Patterns & Architecture
        description: Apply SOLID, common design patterns and clean architecture in large codebases.
      - slug: performance
        title: Performance
        description: Measure and fix slow code with profiling, Core Web Vitals, bundling and caching.
      - slug: security
        title: Security
        description: Prevent XSS, CSRF and injection attacks and handle authentication and secrets safely.
      - slug: system-design
        title: System Design & Leadership
        description: Design scalable systems, give great code reviews and mentor other developers.
